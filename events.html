<!DOCTYPE html>
<html>
<head>
    <title>Events</title>
</head>
<body>
    <h2>All Events</h2>
    <div id="eventList"></div>

    <script>
        fetch('/api/events')
        .then(res => res.json())
        .then(data => {
            let html = '';
            data.forEach(event => {
                html += `
                    <h3>${event.title}</h3>
                    <p>${event.description}</p>
                    <p>${event.event_date} at ${event.event_time}</p>
                    <hr>
                `;
            });
            document.getElementById('eventList').innerHTML = html;
        });
    </script>
</body>
</html>
