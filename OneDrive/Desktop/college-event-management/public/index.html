    <style>
/* RESET */
body {
    margin: 0;
    padding-top: 56px;   /* space for fixed navbar */
    font-family: Arial, sans-serif;
}

/* FIX NAVBAR */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
}

/* REMOVE WHITE BLOCKS IN NAVBAR */
.navbar input,
.navbar form,
.navbar .form-control {
    display: none !important;
}
/* MAIN HEADING STYLE */
.main-heading {
    width: 95%;
    max-width: 1200px;
    margin: 30px auto;
     letter-spacing: 0.5px;

    color: white;

    text-align: center;
    font-size: 30px;
    font-weight: 600;

    padding: 20px 0px 300px 0px;
    border-radius: 12px;

    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
}


/* HERO SECTION */
.hero {
    background:
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        url("uploads/bg.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    min-height: 100vh;
    color: rgb(7, 7, 7);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    
}

/* HERO TEXT */
.hero h1 {
    font-size: 3rem;
}

.hero p {
    font-size: 1.2rem;
}

/* BUTTON CENTER FIX */
.hero a {
    width: 150px;
    height: 45px;
    line-height: 45px;
    background-color: orange;
    color: black;
    border-radius: 8px;
    text-decoration: none;
    display: inline-block;
}
</style>
