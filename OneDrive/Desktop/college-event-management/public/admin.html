<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>Add Event</h2>

<form id="eventForm" enctype="multipart/form-data">
  <input class="form-control mb-2" name="title" placeholder="Title" required>
  <input class="form-control mb-2" name="description" placeholder="Description" required>
  <input class="form-control mb-2" type="date" name="event_date" required>
  <input class="form-control mb-2" type="time" name="event_time" required>
  <input class="form-control mb-2" name="venue" placeholder="Venue" required>

  <!-- IMAGE UPLOAD -->
  <input class="form-control mb-3" type="file" name="image" accept="image/*" required>

  <button class="btn btn-success">Add Event</button>
</form>
 <script>
    document.getElementById('eventForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const formData = new FormData(this);

      fetch('/events/create', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message);
        this.reset();
      });
    });
  </script>
