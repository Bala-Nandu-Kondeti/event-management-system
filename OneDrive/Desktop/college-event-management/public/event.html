<!DOCTYPE html>
<html>
<head>
  <title>Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>All Events</h2>
<div id="events"></div>

<script>
fetch('/events')
  .then(res => res.json())
  .then(data => {
    data.forEach(e => {
      document.getElementById('events').innerHTML += `
        <div class="card mb-3">
          <div class="card-body">
            <h5>${e.title}</h5>
            <p>${e.description}</p>
            <p>${e.event_date} | ${e.event_time}</p>

            <!-- Admin delete button -->
            <button class="btn btn-danger btn-sm" onclick="deleteEvent(${e.id})">
              Delete
            </button>
          </div>
        </div>`;
    });
  });

function deleteEvent(id) {
  fetch('/events/' + id, { method: 'DELETE' })
    .then(res => {
      if (res.status === 403) {
        alert("Admin only");
        return;
      }
      return res.json();
    })
    .then(() => location.reload());
}
</script>

</body>
</html>
